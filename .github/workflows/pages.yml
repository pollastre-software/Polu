# Builds the polu-wasm demo and publishes it as the repository's GitHub Pages site.
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Demo site

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "polu-core/**"
      - "polu-wasm/**"
      - "demo-scenarios/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# one deployment at a time; a newer push replaces a queued one but never cancels a running deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      # the core tests that don't need HiGHS, so a broken core never ships
      - name: Test polu-core
        run: cargo test -p polu-core --no-default-features --features csv,json,xlsx

      # the page, polu-wasm, highs-js (checksum-pinned) and demo-scenarios/, as built locally
      - name: Build the site
        run: sh polu-wasm/demo/build.sh _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
