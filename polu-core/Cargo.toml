[package]
name = "polu-core"
version = "0.1.0"
edition = "2024"

[dependencies]
calamine = { version = "0.37", optional = true }
csv = { version = "1", optional = true }
highs = { version = "2.4.0", optional = true }
rust_xlsxwriter = { version = "0.101", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[features]
default = ["highs", "csv"]
highs = ["dep:highs"]
csv = ["dep:csv"]
xlsx = ["dep:calamine", "dep:rust_xlsxwriter"]
json = ["dep:serde", "dep:serde_json"]
